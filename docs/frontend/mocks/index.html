<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出欠管理 Webアプリ UIモック</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #e5e7eb; color: #111; }
  .top { background: #1f2937; color: #fff; padding: 8px 16px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .top a { color: #93c5fd; font-size: 12px; margin-left: 8px; }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  aside { background: #fff; border-right: 1px solid #d1d5db; overflow: auto; padding: 12px; font-size: 13px; }
  aside h2 { margin: 0 0 4px; font-size: 15px; }
  aside .hint { color: #555; font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
  details.cuj { border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 8px; background: #fafafa; }
  details.cuj > summary { cursor: pointer; padding: 8px; font-weight: bold; }
  .badge { display: inline-block; background: #dbeafe; color: #1e40af; border-radius: 10px; padding: 0 8px; font-size: 11px; margin-right: 6px; font-weight: normal; }
  ol.steps { margin: 0; padding: 0 8px 8px 28px; }
  ol.steps li { margin: 2px 0; }
  details.br > summary { cursor: pointer; padding: 3px 6px; border-radius: 4px; }
  details.br > summary em { font-style: normal; color: #2563eb; font-size: 11px; margin-left: 4px; }
  details.br ul { list-style: none; margin: 2px 0 4px; padding-left: 12px; border-left: 2px solid #bfdbfe; }
  button.step { all: unset; cursor: pointer; display: block; padding: 3px 6px; border-radius: 4px; line-height: 1.4; }
  button.step:hover { background: #e0e7ff; }
  button.step.on { background: #2563eb; color: #fff; }
  .stage { overflow: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; align-items: center; }
  .crumb { width: 100%; max-width: 1100px; font-size: 13px; margin-bottom: 8px; color: #374151; }
  .crumb code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; }
  .monitor { width: 100%; max-width: 1100px; }
  .bezel { background: #111827; border-radius: 14px 14px 6px 6px; padding: 14px 14px 22px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .browser { position: relative; background: #fff; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; height: 640px; }
  .tabs { background: #dfe3e8; display: flex; gap: 10px; padding: 6px 10px 0; align-items: flex-end; }
  .dots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .tab { background: #fff; padding: 5px 14px; border-radius: 6px 6px 0 0; font-size: 12px; }
  .urlbar { display: flex; gap: 8px; padding: 6px 8px; align-items: center; border-bottom: 1px solid #d1d5db; }
  .urlbar .nav { color: #374151; text-decoration: none; padding: 0 6px; font-size: 15px; }
  .url { flex: 1; background: #f3f4f6; border-radius: 14px; padding: 4px 12px; font-size: 12px; color: #374151; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .viewport { flex: 1; overflow: auto; background: #f9fafb; }
  .neck { width: 120px; height: 26px; margin: 0 auto; background: linear-gradient(#4b5563, #1f2937); clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%); }
  .foot { width: 240px; height: 8px; margin: 0 auto; background: #1f2937; border-radius: 4px; }
  .demo { width: 100%; max-width: 1100px; margin-top: 12px; font-size: 13px; color: #1e3a8a; background: #dbeafe; border-radius: 6px; padding: 8px 12px; min-height: 36px; }
  .demo:empty { display: none; }
  #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #111827; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; text-align: center; }
  #toast.show { opacity: .95; }

  /* アプリの中身 */
  .appbar { display: flex; justify-content: space-between; align-items: center; background: #1f2937; color: #fff; padding: 8px 20px; font-size: 14px; }
  .appbar a { color: #93c5fd; }
  .page { padding: 16px 24px 32px; max-width: 920px; margin: 0 auto; }
  .page h2 { margin: 6px 0 4px; font-size: 20px; }
  .page h3 { font-size: 15px; margin: 18px 0 4px; }
  .sub { color: #555; font-size: 12px; margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; background: #fff; }
  th, td { border: 1px solid #d1d5db; padding: 7px 9px; text-align: left; font-size: 14px; }
  th { background: #f3f4f6; }
  tr.warn td { background: #fef3c7; } tr.danger td { background: #fee2e2; }
  a { color: #2563eb; }
  .btn { display: inline-block; padding: 6px 12px; border: 1px solid #6b7280; border-radius: 4px; background: #fff; color: #111; font-size: 14px; text-decoration: none; cursor: pointer; font-family: inherit; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .note { font-size: 12px; color: #555; margin: 8px 0; }
  .msg { padding: 8px 10px; border-radius: 4px; font-size: 13px; margin: 10px 0; }
  .msg.err { background: #fee2e2; border: 1px solid #ef4444; }
  .msg.info { background: #dbeafe; border: 1px solid #3b82f6; }
  .msg.ok { background: #d1fae5; border: 1px solid #10b981; }
  label { display: block; margin: 12px 0 3px; font-size: 13px; }
  input, select, textarea { padding: 6px 8px; font-size: 14px; border: 1px solid #9ca3af; border-radius: 4px; min-width: 260px; font-family: inherit; }
  textarea { width: 100%; min-height: 80px; }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; }
  .ok { background: #d1fae5; } .late { background: #fef3c7; } .abs { background: #fee2e2; } .none { background: #e5e7eb; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .center { text-align: center; padding-top: 70px; }
  .center h1 { font-size: 28px; margin-bottom: 30px; }
  .center .btn { margin: 6px; padding: 12px 22px; font-size: 16px; }
  .hosted { background: #eef2ff; min-height: 100%; padding: 40px 0; }
  .hosted .card { background: #fff; width: 380px; margin: 0 auto; padding: 24px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .hosted .card h2 { margin-top: 0; font-size: 18px; }
  .hosted input { width: 100%; }
  .hosted .logo { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="top">
  <span><b>出欠管理システム</b>　Webアプリ UIモック（画面は操作できます）</span>
  <span><a href="../../windows/mocks/index.html">受付アプリのモックへ →</a><a href="#" id="reset">モックを初期状態に戻す</a></span>
</div>
<div class="layout">
  <aside id="side"></aside>
  <section class="stage">
    <div class="crumb" id="crumb"></div>
    <div class="monitor">
      <div class="bezel">
        <div class="browser">
          <div class="tabs"><span class="dots"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i></span><span class="tab" id="tabTitle">出欠管理</span></div>
          <div class="urlbar"><a href="#" class="nav" data-act="back" title="戻る">←</a><a href="#" class="nav" data-act="reload" title="再読み込み">⟳</a><span class="url" id="url"></span></div>
          <div class="viewport" id="view"></div>
          <div id="toast"></div>
        </div>
      </div>
      <div class="neck"></div><div class="foot"></div>
    </div>
    <div class="demo" id="demoNote"></div>
  </section>
</div>

<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const BASE = 'https://attendance.example.ac.jp';
  const P = { 1: ['07:30', '08:50'], 2: ['09:00', '10:30'], 3: ['10:40', '12:10'], 4: ['13:00', '14:30'] };
  const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
  const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const TAGCLS = { 出席: 'ok', 遅刻: 'late', 早退: 'late', 欠課: 'abs', 公欠: 'none', 未申告: 'none' };
  const tag = st => '<span class="tag ' + (TAGCLS[st] || 'none') + '">' + st + '</span>';
  const A = a => "data-a='" + JSON.stringify(a || {}) + "'";
  const lnk = (id, a, label) => '<a href="#" data-go="' + id + '" ' + A(a) + '>' + label + '</a>';
  const btn = (id, a, label, cls) => '<a href="#" class="btn ' + (cls || '') + '" data-go="' + id + '" ' + A(a) + '>' + label + '</a>';

  /* ---------- モックのデータ ---------- */
  function genSessions(day, period, start, end) {
    const out = [];
    const s = start.split('-').map(Number), e = end.split('-').map(Number);
    const d = new Date(s[0], s[1] - 1, s[2]), last = new Date(e[0], e[1] - 1, e[2]);
    for (let i = 0; d <= last && i < 400; i++, d.setDate(d.getDate() + 1)) {
      if (d.getDay() === day) out.push({ date: fmt(d), s: P[period][0], e: P[period][1], div: '通常' });
    }
    return out;
  }
  function fresh() {
    return {
      role: null, user: '', flags: { fixMode: 'ok', exportEmpty: false }, roster: 'ok',
      d: {
        seq: 0,
        classes: {
          db: { name: 'データベース', room: '3-201', hours: 2, limit: 10, period: 2, day: '月' },
          swe: { name: 'ソフトウェア工学', room: '2-101', hours: 2, limit: 10, period: 3, day: '水' },
          net: { name: '情報ネットワーク', room: '3-105', hours: 2, limit: 8, period: 1, day: '月' }
        },
        teach: ['db', 'net'],
        students: [
          { cd: '2301', name: '青木 一郎', mail: 's2301@example.ac.jp', card: true },
          { cd: '2302', name: '伊藤 花子', mail: 's2302@example.ac.jp', card: true },
          { cd: '2303', name: '上田 健', mail: 's2303@example.ac.jp', card: false },
          { cd: '2304', name: '遠藤 美咲', mail: 's2304@example.ac.jp', card: false }
        ],
        base: { db: { 2301: { abs: 1, late: 0 }, 2302: { abs: 1, late: 2 }, 2303: { abs: 4, late: 2 }, 2304: { abs: 4, late: 3 } } },
        today: {
          db: { 2301: { st: '出席', time: '08:55', v: 0 }, 2302: { st: '遅刻', time: '09:08', v: 0 }, 2303: { st: '未申告', time: '', v: 0 }, 2304: { st: '出席', time: '08:57', v: 0 } },
          net: { 2301: { st: '未申告', time: '', v: 0 }, 2302: { st: '未申告', time: '', v: 0 }, 2303: { st: '未申告', time: '', v: 0 }, 2304: { st: '未申告', time: '', v: 0 } }
        },
        count: 32, history: [],
        sessions: {
          db: [
            { date: '2026-11-09', s: '09:00', e: '10:30', div: '通常' }, { date: '2026-11-16', s: '09:00', e: '10:30', div: '通常' },
            { date: '2026-11-20', s: '13:00', e: '14:30', div: '補講' }, { date: '2026-11-23', s: '09:00', e: '10:30', div: '休講' },
            { date: '2026-11-30', s: '09:00', e: '10:30', div: '通常' }
          ],
          net: [
            { date: '2026-11-09', s: '07:30', e: '08:50', div: '通常' }, { date: '2026-11-16', s: '07:30', e: '08:50', div: '通常' },
            { date: '2026-11-23', s: '07:30', e: '08:50', div: '休講' }, { date: '2026-11-30', s: '07:30', e: '08:50', div: '通常' }
          ]
        },
        stu: {
          db: [['2026-10-05', '出席', '08:58'], ['2026-10-12', '出席', '08:56'], ['2026-10-19', '欠課', ''], ['2026-10-26', '公欠', ''], ['2026-11-02', '出席', '08:55'], ['2026-11-09', '出席', '08:57']],
          swe: ['出席', '遅刻', '欠課', '欠課', '遅刻', '欠課', '遅刻', '欠課'].map((st, i) => [['2026-09-23', '2026-09-30', '2026-10-07', '2026-10-14', '2026-10-21', '2026-10-28', '2026-11-04', '2026-11-11'][i], st, st === '出席' ? '10:35' : (st === '遅刻' ? '10:49' : '')]),
          net: ['2026-10-05', '2026-10-12', '2026-10-19', '2026-10-26', '2026-11-02', '2026-11-09'].map(d => [d, '出席', '07:28'])
        }
      }
    };
  }
  let S = fresh(), cur = { id: 'A_A0001_SD0001', a: {} }, hist = [], timer = null, activeKey = null;
  const CL = () => S.d.classes;

  function stuRecords(k) {
    const r = S.d.stu[k].slice();
    if (k === 'db') { const t = S.d.today.db['2301']; r.push(['2026-11-16', t.st, t.time]); }
    return r;
  }
  function stuSummary(k) {
    const r = stuRecords(k), abs = r.filter(x => x[1] === '欠課').length, late = r.filter(x => x[1] === '遅刻').length;
    const h = abs * CL()[k].hours + Math.floor(late / 3);
    return { h, rem: CL()[k].limit - h };
  }
  function summary(c) {
    const cl = CL()[c];
    return S.d.students.map(s => {
      const b = (S.d.base[c] && S.d.base[c][s.cd]) || { abs: 0, late: 0 }, t = (S.d.today[c] && S.d.today[c][s.cd]) ? S.d.today[c][s.cd].st : '未申告';
      const abs = b.abs + (t === '欠課' ? 1 : 0), late = b.late + (t === '遅刻' ? 1 : 0), h = abs * cl.hours + Math.floor(late / 3);
      return Object.assign({}, s, { abs, late, h, rem: cl.limit - h });
    });
  }

  /* ---------- 画面 ---------- */
  const bar = () => '<div class="appbar"><b>出欠管理</b><span>' + S.user + '（' + (S.role === 'student' ? '学生' : '教員') + '）　<a href="#" data-act="logout">サインアウト</a></span></div>';
  const home = () => S.role === 'student' ? 'A_S0002_SL0001' : 'A_S0003_SL0001';
  const back = (id, a, label) => '<p>' + lnk(id, a, '← ' + label) + '</p>';

  const SCREENS = {
    A_A0001_SD0001: {
      name: 'サインイン', path: () => '/signin',
      render: () => '<div class="center"><h1>出欠管理システム</h1>' +
        '<a href="#" class="btn primary" data-act="hosted" data-pool="student">学生としてサインイン</a>' +
        '<a href="#" class="btn primary" data-act="hosted" data-pool="teacher">教員としてサインイン</a>' +
        '<p class="note" style="max-width:520px;margin:24px auto">ボタンを押すと Cognito の Hosted UI（学生用／教員用）に移ります。初めての人は、招待メールの仮パスワードでサインインし、新しいパスワードを決めます。</p></div>'
    },
    HOSTED: {
      name: 'Cognito Hosted UI（外部画面）',
      url: a => 'https://attendance-' + a.pool + '.auth.ap-northeast-1.amazoncognito.com/login',
      render: a => {
        const stu = a.pool === 'student', first = a.mode === 'first';
        let h = '<div class="hosted"><div class="card"><div class="logo">Amazon Cognito Hosted UI（このモックでは見た目だけ）</div>';
        if (a.stage === 'newpw') {
          h += '<h2>新しいパスワードを設定</h2><p class="note">初回サインインのため、新しいパスワードを決めてください。</p>' +
            '<label>新しいパスワード</label><input id="np1" type="password" value="NewPassw0rd!"><label>新しいパスワード（確認）</label><input id="np2" type="password" value="NewPassw0rd!">' +
            '<p class="note" id="hmsg" style="color:#b91c1c"></p><p><a href="#" class="btn primary" data-act="newpw" data-pool="' + a.pool + '">設定してサインイン</a></p>';
        } else {
          h += '<h2>' + (stu ? '学生' : '教員') + '用 サインイン</h2>' +
            '<label>ユーザー名（メールアドレス）</label><input id="hu" value="' + (stu ? 's2301@example.ac.jp' : 'sato@example.ac.jp') + '">' +
            '<label>' + (first ? '仮パスワード（招待メールに書かれています）' : 'パスワード') + '</label><input id="hp" type="password" value="' + (first ? 'Aq7kP2zX' : 'password123') + '">' +
            '<p class="note">' + (first ? '招待メールの仮パスワードで初めてサインインすると、新しいパスワードを決める画面に進みます（Cognito の標準フロー）。' : '登録済みのアカウントです。') + '</p>' +
            '<p><a href="#" class="btn primary" data-act="hostedLogin" data-pool="' + a.pool + '" data-mode="' + a.mode + '">サインイン</a></p>';
        }
        return h + '</div></div>';
      }
    },
    A_S0002_SL0001: {
      name: '学生ホーム（受講授業一覧）', path: () => '/student/classes', roles: ['student'],
      render: () => bar() + '<div class="page"><h2>受講授業</h2><div class="sub">A_S0002_SL0001</div><table><tr><th>授業</th><th>欠課時数</th><th>上限</th><th>上限までの残り</th></tr>' +
        ['swe', 'db', 'net'].map(k => { const r = stuSummary(k); return '<tr class="' + (r.rem <= 2 ? 'warn' : '') + '"><td>' + lnk('A_S0002_SL0002', { c: k }, CL()[k].name) + '</td><td>' + r.h + '</td><td>' + CL()[k].limit + '</td><td>' + r.rem + ' 時間</td></tr>'; }).join('') +
        '</table><p class="note">残りが少ない授業は黄色で強調します。</p></div>'
    },
    A_S0002_SL0002: {
      name: '授業別出欠記録', path: a => '/student/classes/' + (a.c || 'db'), roles: ['student'],
      render: a => {
        const k = a.c || 'db', r = stuSummary(k);
        return bar() + '<div class="page">' + back('A_S0002_SL0001', {}, '受講授業一覧') + '<h2>' + CL()[k].name + '</h2><div class="sub">A_S0002_SL0002</div>' +
          '<p>欠課時数 <b>' + r.h + '</b> ／ 上限 ' + CL()[k].limit + ' ／ 残り <b>' + r.rem + '</b> 時間</p><table><tr><th>日付</th><th>出欠</th><th>申告時刻</th></tr>' +
          stuRecords(k).map(x => '<tr><td>' + x[0] + '</td><td>' + tag(x[1]) + '</td><td>' + (x[2] || '—') + '</td></tr>').join('') + '</table></div>';
      }
    },
    A_S0003_SL0001: {
      name: '教員ホーム（担当授業一覧）', path: () => '/teacher', roles: ['teacher'],
      render: () => bar() + '<div class="page"><h2>教員ホーム</h2><div class="sub">A_S0003_SL0001</div><h3>今日の授業回（2026-11-16）</h3><table><tr><th>時限</th><th>授業</th><th>教室</th><th>状態</th><th></th></tr>' +
        '<tr><td>2限 09:00-10:30</td><td>データベース</td><td>3-201</td><td>受付中（' + S.d.count + ' / 40）</td><td>' + btn('A_S0003_SL0002', { c: 'db' }, '出欠一覧') + '</td></tr>' +
        '<tr><td>1限 07:30-08:50</td><td>情報ネットワーク</td><td>3-105</td><td><span class="tag none">未実施</span>（受付を開始しなかった）</td><td>' + btn('A_S0003_SL0002', { c: 'net' }, '出欠一覧') + '</td></tr></table>' +
        '<h3>担当授業</h3><table><tr><th>授業</th><th></th></tr>' +
        S.d.teach.map(k => '<tr><td>' + CL()[k].name + '</td><td>' + btn('A_S0003_SL0003', { c: k }, '欠課時数一覧') + ' ' + btn('A_S0006_SD0001', { c: k }, '授業編集') + ' ' + btn('A_S0006_SD0002', { c: k }, '授業回編集') + ' ' + btn('A_S0006_SD0003', { c: k }, '受講学生登録') + '</td></tr>').join('') +
        '</table><p>' + btn('A_S0005_SL0001', {}, '学生一覧') + ' ' + btn('A_S0006_SD0001', {}, '授業を登録', 'primary') + '</p><p class="note">受付の開始・終了は、教室PCの受付アプリで行います。</p></div>'
    },
    A_S0003_SL0002: {
      name: '授業回別出欠一覧', path: a => '/teacher/sessions/' + (a.c || 'db'), roles: ['teacher'],
      render: a => {
        const c = a.c || 'db', live = c === 'db', t = S.d.today[c];
        return bar() + '<div class="page">' + back('A_S0003_SL0001', {}, '教員ホーム') + '<h2>授業回別出欠一覧</h2><div class="sub">A_S0003_SL0002</div>' +

  /* ---------- 描画・遷移 ---------- */
  function render() {
    clearInterval(timer);
    let id = cur.id, a = cur.a, sc = SCREENS[id], forbidden = false;
    if (sc.roles && !S.role) { id = 'A_A0001_SD0001'; a = {}; cur = { id, a }; sc = SCREENS[id]; }
    else if (sc.roles && !sc.roles.includes(S.role)) forbidden = true;
    const shown = forbidden ? SCREENS.FORBIDDEN : sc;
    $('#view').innerHTML = shown.render(a);
    $('#view').scrollTop = 0;
    const url = sc.url ? sc.url(a) : BASE + sc.path(a);
    $('#url').textContent = (url.indexOf('https') === 0 ? '🔒 ' : '') + url;
    $('#tabTitle').textContent = shown.name;
    $('#crumb').innerHTML = '現在の画面: <b>' + shown.name + '</b> <code>' + (forbidden ? id + ' → SYSCOMMON_E000101' : id) + '</code>';
    if (!forbidden && sc.after) sc.after(a);
  }
  function go(id, a, opt) { opt = opt || {}; if (!opt.replace) hist.push(cur); cur = { id, a: a || {} }; render(); }
  function jump(id, a) { hist = []; cur = { id, a: a || {} }; render(); }
  function as(role) { S.role = role; S.user = role === 'student' ? '青木 一郎' : '佐藤 先生'; }
  function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); }
  function note(t) { $('#demoNote').textContent = t ? 'デモの設定: ' + t : ''; }
  function signIn(pool) { as(pool); hist = []; go(pool === 'student' ? 'A_S0002_SL0001' : 'A_S0003_SL0001', {}, { replace: true }); toast('サインインしました'); }

  const ACT = {
    back() { if (hist.length) { cur = hist.pop(); render(); } },
    reload() { render(); },
    hosted(el) { go('HOSTED', { pool: el.dataset.pool, mode: 'normal', stage: 'login' }); },
    hostedLogin(el) { if (el.dataset.mode === 'first') go('HOSTED', { pool: el.dataset.pool, mode: 'first', stage: 'newpw' }, { replace: true }); else signIn(el.dataset.pool); },
    newpw(el) { const p1 = $('#np1').value, p2 = $('#np2').value; if (!p1 || p1 !== p2) { $('#hmsg').textContent = 'パスワードが一致しません'; return; } signIn(el.dataset.pool); },
    logout() { S.role = null; S.user = ''; hist = []; go('A_A0001_SD0001', {}, { replace: true }); },
    fixSubmit(el) {
      const c = el.dataset.c, cd = el.dataset.cd, st = $('#fs').value, reason = $('#fr').value.trim();
      if (!reason) { go('A_S0004_SD0001', { c, cd, st, reason, err: 'E1' }, { replace: true }); return; }
      if (S.flags.fixMode === 'conflict') { go('A_S0004_SD0001', { c, cd, st, reason, err: 'E2' }, { replace: true }); return; }
      const rec = S.d.today[c][cd], before = rec.st;
      rec.st = st; rec.v++; rec.time = (st === '出席' || st === '遅刻') ? (rec.time || '—') : rec.time;
      S.d.history.push({ c, cd, before, after: st, reason, at: '2026-11-16 09:42' });
      toast('修正しました（変更前後を履歴に残しました）');
      go('A_S0003_SL0002', { c }, { replace: true });
    },
    fixReload(el) { S.flags.fixMode = 'ok'; go('A_S0004_SD0001', { c: el.dataset.c, cd: el.dataset.cd }, { replace: true }); note(''); },
    exportXlsx(el) {
      if (S.flags.exportEmpty) { toast('書き出す出欠記録がありません（A_F0002_W000001）'); return; }
      toast('出欠_' + CL()[el.dataset.c].name + '_20261116094200.xlsx を書き出しました（希望機能）');
    },
    studentSave(el) {
      const cd = $('#sc').value.trim(), nm = $('#sn').value.trim(), ml = $('#sm').value.trim();
      if (!cd || !nm || !ml) { $('#smsg').textContent = '学籍番号・氏名・メールアドレスを入力してください'; return; }
      if (el.dataset.cd) { const s = S.d.students.find(x => x.cd === el.dataset.cd); s.name = nm; s.mail = ml; toast('保存しました'); }
      else { S.d.students.push({ cd, name: nm, mail: ml, card: false }); toast('登録しました。' + ml + ' に招待メールを送りました'); }
      go('A_S0005_SL0001', {}, { replace: true });
    },
    cardInvalidate(el) { S.d.students.find(x => x.cd === el.dataset.cd).card = false; toast('学生証を無効にしました。再発行した学生証は受付アプリで登録します'); go('A_S0005_SD0001', { cd: el.dataset.cd }, { replace: true }); },
    classSave(el) {
      const name = $('#cn').value.trim(), room = $('#cr').value, hours = +$('#ch').value || 2, limit = +$('#cl').value || 10;
      if (!name) { $('#cmsg').textContent = '科目名を入力してください'; return; }
      if (el.dataset.c) { Object.assign(CL()[el.dataset.c], { name, room, hours, limit }); toast('授業を保存しました'); go('A_S0003_SL0001', {}, { replace: true }); return; }
      const day = +$('#cd').value, period = +$('#cp').value, ss = genSessions(day, period, $('#sd').value, $('#ed').value);
      if (!ss.length) { $('#cmsg').textContent = '期間の中に、選んだ曜日の日がありません'; return; }
      const id = 'n' + (++S.d.seq);
      CL()[id] = { name, room, hours, limit, period, day: DAYS[day] }; S.d.teach.push(id); S.d.sessions[id] = ss;
      toast('授業を登録しました（授業回を ' + ss.length + ' 回作りました）');
      go('A_S0006_SD0002', { c: id }, { replace: true });
    },
    sessionSave(el) {
      const x = S.d.sessions[el.dataset.c][+el.dataset.i], i = el.dataset.i;
      x.s = $('#st' + i).value; x.e = $('#en' + i).value; x.div = $('#dv' + i).value;
      toast(x.date + ' の授業回を保存しました（' + x.div + '）');
    },
    sessionAdd(el) { S.d.sessions[el.dataset.c].push({ date: '2026-12-04', s: '13:00', e: '14:30', div: '補講' }); toast('補講の授業回を追加しました'); go('A_S0006_SD0002', { c: el.dataset.c }, { replace: true }); },
    rosterImport(el) { go('A_S0006_SD0003', { c: el.dataset.c, sample: $('#smp').value, stage: 'result' }, { replace: true }); },
    rosterCommit(el) {
      if (el.dataset.disabled) { toast('誤りがあるので保存できません'); return; }
      toast('受講学生を保存しました（新規 1 名に招待メールを送りました）'); go('A_S0003_SL0001', {}, { replace: true });
    }
  };

  /* ---------- 左側のユースケース（CUJ） ---------- */
  const stu = k => () => { as('student'); jump('A_S0002_SL0002', { c: k }); };

      { t: 'Hosted UI でサインインする', br: [

      ] },
      { t: '学生ホームで上限までの残りを見る', run() { as('student'); jump('A_S0002_SL0001'); } },
      { t: '授業を選んで出欠記録を見る', br: [
        { t: 'データベース（残りに余裕がある）', run: stu('db') }, { t: 'ソフトウェア工学（残りが少ない）', run: stu('swe') }, { t: '情報ネットワーク（欠課なし）', run: stu('net') }
      ] }
    ] },
    { actor: '教員', title: '受付中の出欠を見て、修正する', steps: [
      { t: '教員としてサインインする', run() { S.role = null; jump('HOSTED', { pool: 'teacher', mode: 'normal', stage: 'login' }); note('教員用ユーザープールの Hosted UI。'); } },
      { t: '教員ホームで今日の授業回を見る', run() { as('teacher'); jump('A_S0003_SL0001'); } },
      { t: '授業回別出欠一覧を開く', br: [
        { t: '受付中の授業回（データベース）。申告人数が自動で増える', run() { as('teacher'); jump('A_S0003_SL0002', { c: 'db' }); } },
        { t: '受付を開始しなかった授業回（情報ネットワーク）', run() { as('teacher'); jump('A_S0003_SL0002', { c: 'net' }); } }
      ] },
      { t: '未申告の学生（上田 健）の出欠を修正する', br: [
        { t: '理由を書いて修正する（成功）', run() { as('teacher'); S.flags.fixMode = 'ok'; jump('A_S0004_SD0001', { c: 'db', cd: '2303' }); note('理由を書いて「修正する」を押すと、一覧と履歴に反映されます。'); } },
        { t: '理由を書かずに送信する（エラー）', run() { as('teacher'); S.flags.fixMode = 'ok'; jump('A_S0004_SD0001', { c: 'db', cd: '2303' }); note('理由を空のまま「修正する」を押すと、A_S0004_E000001 が出ます。'); } },
        { t: '他の人が先に更新していた（競合エラー）', run() { as('teacher'); S.flags.fixMode = 'conflict'; jump('A_S0004_SD0001', { c: 'db', cd: '2303' }); note('理由を書いて「修正する」を押すと、A_S0004_E000002（楽観的排他の競合）が出ます。'); } }
      ] },
      { t: '一覧に戻って、反映を確認する', run() { as('teacher'); jump('A_S0003_SL0002', { c: 'db' }); } }
    ] },
    { actor: '教員', title: '欠課の多い学生を確認する', steps: [

        { t: '記録がない場合（A_F0002_W000001）', run() { as('teacher'); S.flags.exportEmpty = true; jump('A_S0003_SL0003', { c: 'net' }); note('「Excel で書き出し」を押すと、記録なしの警告が出ます。'); } }
      ] }
    ] },
    { actor: '教員', title: '授業を登録し、受講学生を取り込む', steps: [
      { t: '授業を登録する（授業回を自動で作る）', run() { as('teacher'); jump('A_S0006_SD0001'); note('科目名を入れて「登録して授業回を作る」を押すと、曜日・時限・期間から授業回を作ります。'); } },
      { t: '授業回を編集する（休講・補講・時間変更）', run() { as('teacher'); jump('A_S0006_SD0002', { c: 'db' }); } },

      { t: '学生でサインインしたまま、教員の画面を開く（403）', run() { as('student'); jump('A_S0003_SL0001'); note('学生ロールで教員の画面を開いたので、SYSCOMMON_E000101 が出ます。'); } }
    ] }
  ];

  function buildSide() {
    let h = '<h2>ユースケース（CUJ）</h2><p class="hint">ユーザーの主な操作の流れです。ステップを押すと、その画面を表示します。<b>▼ 分岐</b>を開くと、選択肢が出ます。</p>';
    CUJS.forEach((c, i) => {
      h += '<details class="cuj"' + (i === 0 ? ' open' : '') + '><summary><span class="badge">' + c.actor + '</span>' + c.title + '</summary><ol class="steps">';
      c.steps.forEach((s, j) => {
        if (s.br) {
          h += '<li><details class="br"><summary>' + s.t + '<em>▼ 分岐 ' + s.br.length + '</em></summary><ul>' + s.br.map((b, k) => '<li><button class="step" data-k="' + i + '.' + j + '.' + k + '">' + b.t + '</button></li>').join('') + '</ul></details></li>';
        } else h += '<li><button class="step" data-k="' + i + '.' + j + '">' + s.t + '</button></li>';
      });
      h += '</ol></details>';
    });
    $('#side').innerHTML = h;
  }
  function runStep(key) {
    const p = key.split('.').map(Number);
    const s = CUJS[p[0]].steps[p[1]], step = p.length === 3 ? s.br[p[2]] : s;
    note(''); S.flags.exportEmpty = S.flags.exportEmpty && false;
    step.run();
    activeKey = key;
    document.querySelectorAll('button.step').forEach(b => {
      const on = b.dataset.k === key; b.classList.toggle('on', on);
      if (on) { let d = b.closest('details.br'); if (d) d.open = true; d = b.closest('details.cuj'); if (d) d.open = true; }
    });
  }

  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.dataset.go, JSON.parse(g.dataset.a || '{}')); return; }
    const a = e.target.closest('[data-act]');
    if (a) { e.preventDefault(); ACT[a.dataset.act](a); return; }
    const st = e.target.closest('button.step');
    if (st) runStep(st.dataset.k);
  });
  $('#reset').addEventListener('click', e => { e.preventDefault(); S = fresh(); hist = []; cur = { id: 'A_A0001_SD0001', a: {} }; note(''); document.querySelectorAll('button.step').forEach(b => b.classList.remove('on')); render(); toast('初期状態に戻しました'); });

  buildSide();
  render();
})();
</script>
