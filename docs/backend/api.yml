  /api/v1/reception/touches:
    post:
      tags: [受付]
      operationId: touchCard
      summary: 学生証をかざした（申告）
      description: |
        サーバが次の順に確かめる。受付中か（締切後は `resultDiv` 9）→ 有効な学生証か（8）→ その授業の受講学生か（7）→ すでに申告済みか（2）→ 判定して登録（1）。
        すべてのタッチ（エラー含む）をタッチログに残す。判定はサーバ時刻で行う。
        **結果は、成功・申告済み・エラーのどれも HTTP 200 で返す。**
      x-feature-id: A_S0001
      x-screen-id: A_S0001_SD0001
      x-roles: [teacher]
      x-db-access-patterns: [1, 2, 3, 4, 5]
      parameters:
        - $ref: '#/components/parameters/ReceptionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchRequest'
      responses:
        '200':
          description: 申告の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResponse'
              examples:
                attended:
                  summary: 出席
                  value:
                    resultDiv: 1
                    messageId: A_S0001_I000001
                    message: 青木 一郎さん　出席
                    attendanceStatus: 10
                    touchedCount: 32
                    enrolledCount: 40
                    serverTime: '2026-11-16T08:55:03+09:00'
                alreadyTouched:
                  summary: 申告済み
                  value:
                    resultDiv: 2
                    messageId: A_S0001_I000002
                    message: 青木 一郎さんは申告済みです
                    touchedCount: 32
                    enrolledCount: 40
                    serverTime: '2026-11-16T08:55:30+09:00'
                unregistered:
                  summary: 未登録の学生証
                  value:
                    resultDiv: 8
                    messageId: A_S0001_E000001
                    message: 登録されていない学生証です。担当の先生に申し出てください
                    touchedCount: 32
                    enrolledCount: 40
                    serverTime: '2026-11-16T08:56:10+09:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Web のセッション Cookie（署名付き、HttpOnly・Secure・SameSite=Lax）。更新系は `X-CSRF-Token` も付ける。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 受付アプリ。Cognito のアクセストークン。
    devUserAuth:
      type: apiKey
      in: header
      name: X-Dev-User
      description: 開発用（AUTH_MODE=dev のときだけ）。user_id を送ると、その本人になる。本番では無効。
  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      description: 授業ID（ULID）
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 授業回ID（ULID）
      schema:
        type: string
    StudentId:
      name: studentId
      in: path
      required: true
      description: 学生ID（user_id と同じ値）
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 認証の更新系では必須（Cookie に入れた値との二重送信）。Bearer 認証では不要。
      schema:
        type: string
    ReceptionToken:
      name: X-Reception-Token
      in: header
      required: true
      description: 受付開始で発行した、署名付きの受付トークン。受付アプリ以外からは申告できないようにする。
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未サインイン、またはセッションの失効（本文なし）
    Forbidden:
      description: 権限がない、または担当外（SYSCOMMON_E000101）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            messageId: SYSCOMMON_E000101
            message: この画面を表示する権限がありません
    NotFound:
      description: 対象が見つからない（書き出す記録がない場合は A_F0002_W000001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 競合（楽観的排他は A_S0004_E000002、学生証の重複は A_S0005_E000001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            messageId: A_S0004_E000002
            message: 他の人が先に更新しました。画面を開き直してください
    ValidationError:
      description: 入力の誤り（例 A_S0004_E000001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            messageId: A_S0004_E000001
            message: 修正理由を入力してください
  schemas:
    Error:
      type: object
      required: [messageId, message]
      properties:
        messageId:
          type: string
          example: SYSCOMMON_E000101
        message:
          type: string
    AttendanceStatus:
      type: integer
      enum: [10, 20, 30, 40, 50]
      description: 出欠区分。10 出席、20 遅刻、30 早退、40 欠課、50 公欠（[codes.md](../engineering/catalog/codes.md)）。
    ReceptionStatus:
      type: integer
      enum: [0, 1, 2]
      description: 受付状態。0 未開始、1 受付中、2 締切済。
    SessionDiv:
      type: integer
      enum: [1, 2, 9]
      description: 授業回区分。1 通常、2 補講、9 休講。休講の回は出欠を記録しない。
    ResultDiv:
      type: integer
      enum: [1, 2, 7, 8, 9]
      description: タッチ結果区分。1 受付、2 申告済み、7 受講対象外、8 未登録、9 締切後。
    Me:
      type: object
      required: [userId, name, role]
      properties:
        userId:
          type: string
          description: Cognito のユーザーID（sub）
        name:
          type: string
          example: 青木 一郎
        role:
          type: string
          enum: [student, teacher]
    Class:
      type: object
      required: [classId, subjectName, roomName, sessionHours, absenceLimitHours]
      properties:
        classId:
          type: string
        subjectName:
          type: string
          example: データベース
        roomName:
          type: string
          example: 3-201
        sessionHours:
          type: integer
          description: 1回あたりの時間数（初期値 2）
          example: 2
        absenceLimitHours:
          type: integer
          description: 欠課上限（時間）
          example: 10
    StudentClassSummary:
      type: object
      required: [classId, subjectName, absenceHours, absenceLimitHours, remainingHours]
      properties:
        classId:
          type: string
        subjectName:
          type: string
        absenceHours:
          type: integer
          description: 欠課時数。欠課回数 × 1回あたりの時間数 ＋ 遅刻回数を3で割った商。公欠は数えない。
          example: 9
        absenceLimitHours:
          type: integer
          example: 10
        remainingHours:
          type: integer
          description: 上限までの残り
          example: 1
    StudentAttendance:
      type: object
      required: [date, attendanceStatus]
      properties:
        date:
          type: string
          format: date
        attendanceStatus:
          allOf:
            - $ref: '#/components/schemas/AttendanceStatus'
          nullable: true
          description: 未申告のとき null
        touchDatetime:
          type: string
          format: date-time
          nullable: true
    TodaySession:
      type: object
      required: [sessionId, classId, subjectName, roomName, startDatetime, endDatetime, receptionStatus, touchedCount, enrolledCount, notConducted]
      properties:
        sessionId:
          type: string
        classId:
          type: string
        subjectName:
          type: string
        roomName:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        sessionDiv:
          $ref: '#/components/schemas/SessionDiv'
        receptionStatus:
          $ref: '#/components/schemas/ReceptionStatus'
        touchedCount:
          type: integer
          description: 申告人数
        enrolledCount:
          type: integer
          description: 受講者数
        notConducted:
          type: boolean
          description: 受付を開始しないまま終了時刻を過ぎた（未実施）
    SessionAttendance:
      type: object
      required: [studentId, studentCd, studentName, version]
      properties:
        studentId:
          type: string
        studentCd:
          type: string
          description: 学籍番号
          example: '2301'
        studentName:
          type: string
        attendanceStatus:
          allOf:
            - $ref: '#/components/schemas/AttendanceStatus'
          nullable: true
          description: 未申告のとき null
        touchDatetime:
          type: string
          format: date-time
          nullable: true
          description: 学生証で申告したサーバ時刻。教員入力・自動のときは null
        version:
          type: integer
          description: 更新バージョン（楽観的排他。出欠がまだないときは 0）
    SessionAttendanceList:
      type: object
      required: [sessionId, subjectName, receptionStatus, touchedCount, enrolledCount, attendances]
      properties:
        sessionId:
          type: string
        subjectName:
          type: string
        startDatetime:
          type: string
          format: date-time
        receptionStatus:
          $ref: '#/components/schemas/ReceptionStatus'
        touchedCount:
          type: integer
        enrolledCount:
          type: integer
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/SessionAttendance'
    AbsenceSummary:
      type: object
      required: [classId, sessionHours, absenceLimitHours, rows]
      properties:
        classId:
          type: string
        sessionHours:
          type: integer
        absenceLimitHours:
          type: integer
        rows:
          type: array
          items:
            type: object
            required: [studentId, studentCd, studentName, absentCount, lateCount, absenceHours, remainingHours]
            properties:
              studentId:
                type: string
              studentCd:
                type: string
              studentName:
                type: string
              absentCount:
                type: integer
              lateCount:
                type: integer
              absenceHours:
                type: integer
              remainingHours:
                type: integer
    AttendanceFixRequest:
      type: object
      required: [attendanceStatus, reason, version]
      properties:
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        reason:
          type: string
          description: 修正理由（必須）
        version:
          type: integer
          description: 画面で見ていた更新バージョン
    Student:
      type: object
      required: [studentId, studentCd, studentName, email, cardRegistered]
      properties:
        studentId:
          type: string
        studentCd:
          type: string
        studentName:
          type: string
        email:
          type: string
          format: email
          description: ログインID（Microsoft のメールアドレス）
        cardRegistered:
          type: boolean
          description: 有効な学生証が登録されているか
    StudentCreateRequest:
      type: object
      required: [studentCd, studentName, email]
      properties:
        studentCd:
          type: string
        studentName:
          type: string
        email:
          type: string
          format: email
    CardRegisterRequest:
      type: object
      required: [cardUid]
      properties:
        cardUid:
          type: string
          description: 学生証のカードID。画面には出さない。
    Period:
      type: object
      required: [periodSeq, startTm, endTm]
      properties:
        periodSeq:
          type: integer
          example: 2
        startTm:
          type: string
          example: '09:00'
        endTm:
          type: string
          example: '10:30'
    ClassCreateRequest:
      type: object
      required: [subjectName, roomName, sessionHours, absenceLimitHours, schedule]
      properties:
        subjectName:
          type: string
        roomName:
          type: string
        sessionHours:
          type: integer
          example: 2
        absenceLimitHours:
          type: integer
          example: 10
        schedule:
          type: object
          description: 授業回の生成条件。授業には保存しない。
          required: [dayDiv, periodSeq, startDt, endDt]
          properties:
            dayDiv:
              type: integer
              minimum: 1
              maximum: 5
              description: 曜日区分。1 月〜5 金
            periodSeq:
              type: integer
            startDt:
              type: string
              format: date
            endDt:
              type: string
              format: date
    ClassUpdateRequest:
      type: object
      required: [subjectName, roomName, sessionHours, absenceLimitHours]
      properties:
        subjectName:
          type: string
        roomName:
          type: string
        sessionHours:
          type: integer
        absenceLimitHours:
          type: integer
    Session:
      type: object
      required: [sessionId, classId, startDatetime, endDatetime, sessionDiv, receptionStatus]
      properties:
        sessionId:
          type: string
        classId:
          type: string
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        sessionDiv:
          $ref: '#/components/schemas/SessionDiv'
        receptionStatus:
          $ref: '#/components/schemas/ReceptionStatus'
    SessionCreateRequest:
      type: object
      required: [startDatetime, endDatetime]
      properties:
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
    SessionUpdateRequest:
      type: object
      required: [startDatetime, endDatetime, sessionDiv]
      properties:
        startDatetime:
          type: string
          format: date-time
        endDatetime:
          type: string
          format: date-time
        sessionDiv:
          $ref: '#/components/schemas/SessionDiv'
    RosterImportResult:
      type: object
      required: [canCommit, rows]
      properties:
        canCommit:
          type: boolean
          description: 誤りがなく、保存できる
        rows:
          type: array
          items:
            type: object
            required: [row, result]
            properties:
              row:
                type: integer
                description: 名簿の行番号
              studentCd:
                type: string
              studentName:
                type: string
              result:
                type: string
                enum: [existing, new, error]
                description: existing は登録済みの学生、new は新規登録（招待メールを送る）、error は誤り
              messageId:
                type: string
                description: 誤りのとき A_F0001_E000001
              message:
                type: string
                description: 誤りのとき「名簿の{行}行目：{内容}」
        registeredCount:
          type: integer
          description: commit のとき、受講学生として登録した人数
        invitedCount:
          type: integer
          description: commit のとき、招待メールを送った（新規登録した）人数
    ReceptionStartResponse:
      type: object
      required: [sessionId, receptionToken, serverTime]
      properties:
        sessionId:
          type: string
        receptionToken:
          type: string
          description: 署名付きの受付トークン。授業回ID と期限が入っている。
        serverTime:
          type: string
          format: date-time
    ReceptionStopResponse:
      type: object
      required: [touchedCount, enrolledCount, autoAbsentCount]
      properties:
        touchedCount:
          type: integer
        enrolledCount:
          type: integer
        autoAbsentCount:
          type: integer
          description: 記録がないので、欠課（自動）で登録した人数
    TouchRequest:
      type: object
      required: [sessionId, cardUid]
      properties:
        sessionId:
          type: string
        cardUid:
          type: string
          description: 学生証のカードID。画面には出さない。
    TouchResponse:
      type: object
      required: [resultDiv, messageId, message, touchedCount, enrolledCount, serverTime]
      properties:
        resultDiv:
          $ref: '#/components/schemas/ResultDiv'
        messageId:
          type: string
          description: メッセージ台帳のID
        message:
          type: string
          description: 画面に出す文言
        attendanceStatus:
          allOf:
            - $ref: '#/components/schemas/AttendanceStatus'
          description: 登録できたときだけ返す
        touchedCount:
          type: integer
          description: 申告人数
        enrolledCount:
          type: integer
          description: 受講者数
        serverTime:
          type: string
          format: date-time
