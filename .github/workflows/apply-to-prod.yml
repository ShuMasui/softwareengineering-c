# インフラ（Terraform）の plan と apply。ENG-011。説明は docs/engineering/infra.md。
#
# 流れ
#   1. pull_request（infra/env/ と infra/modules/ の変更）: fmt・validate・plan だけ。apply はしない。
#   2. main への push: plan を作り、計画ファイルを S3 に保存する。
#   3. 承認: GitHub の Environment「production」の承認者が承認する。
#   4. apply: S3 から計画ファイルを取り出して、そのまま apply する（plan をやり直さない）。
#   5. 手動（workflow_dispatch）: plan_sha を指定すると、S3 に保存済みのその計画で apply する。
#
# 前提（GitHub の Variables）: TF_STATE_BUCKET, TF_PLAN_BUCKET, TF_PLAN_ROLE_ARN, TF_APPLY_ROLE_ARN
# 前提（Terraform）: infra/env/prod/ に backend "s3" {}（中身は空）を書く。バケット等は init のときに渡す。
#   infra/bootstrap/ は、この workflow に含めない（手元で1回だけ apply する）。

name: apply-to-prod

on:
  pull_request:
    paths:
      - 'infra/env/**'
      - 'infra/modules/**'
      - '.github/workflows/apply-to-prod.yml'
  push:
    branches: [main]
    paths:
      - 'infra/env/**'
      - 'infra/modules/**'
  workflow_dispatch:
    inputs:
      plan_sha:
        description: 'S3 に保存済みの計画をそのまま apply する場合は、その計画を作ったコミットの SHA。空なら、いまの main で plan する'
        required: false
        default: ''

# main への実行は1つずつ（apply が重ならないようにする）。実行中のものは止めない。
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.10.5
  TF_IN_AUTOMATION: 'true'
  PLAN_KEY: plans/${{ inputs.plan_sha || github.sha }}/tfplan

jobs:
  plan:
    # pull_request、main への push、plan_sha が空の手動実行のとき
    if: github.event_name != 'workflow_dispatch' || inputs.plan_sha == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/env/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt（infra/ の全部）
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          # pull_request の plan は状態のロックを取らない（main の apply を待たせないため）
          LOCK_FLAG: ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
        run: terraform plan -input=false -lock-timeout=5m $LOCK_FLAG -out=tfplan

      - name: 計画を job summary に出す
        run: |
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 計画を S3 に保存する（main のときだけ）
        if: github.event_name != 'pull_request'
        run: aws s3 cp tfplan "s3://${{ vars.TF_PLAN_BUCKET }}/${{ env.PLAN_KEY }}" --sse AES256

  apply:
    needs: plan
    # main のとき、plan が成功したか、plan を飛ばした手動実行（plan_sha 指定）のときだけ
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ubuntu-latest
    # 承認者を Environment「production」に設定しておくと、ここで承認待ちになる
    environment: production
    defaults:
      run:
        working-directory: infra/env/prod
    steps:
      # 計画を作ったときと同じコミットのコードで apply する
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.plan_sha || github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 計画を S3 から取り出す
        run: aws s3 cp "s3://${{ vars.TF_PLAN_BUCKET }}/${{ env.PLAN_KEY }}" tfplan

      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - name: Terraform apply（S3 から取り出した計画）
        run: terraform apply -input=false -lock-timeout=10m tfplan
